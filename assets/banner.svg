<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#3a7bd5" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="slight-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2d47" stroke-width="0.8" opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse-ring {
      0% { r: 12px; opacity: 0.8; }
      50% { r: 24px; opacity: 0.1; }
      100% { r: 12px; opacity: 0.8; }
    }
    @keyframes float-node {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes beam-flow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scan-line {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.4; }
      100% { transform: translateY(450px); opacity: 0; }
    }
    .node-pulse {
      animation: pulse-ring 3s infinite ease-in-out;
    }
    .floating-circuit {
      animation: float-node 6s infinite ease-in-out;
    }
    .cyber-beam {
      stroke-dasharray: 20, 10;
      animation: beam-flow 8s linear infinite;
    }
    .scanner {
      animation: scan-line 7s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />
  <rect width="1200" height="400" fill="url(#cyber-grid)" />

  <!-- Dynamic Cyber Background Elements -->
  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="80" r="140" fill="#3a7bd5" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="160" fill="#9d4edd" opacity="0.1" filter="url(#glow)" />
  <circle cx="950" cy="100" r="120" fill="#00f5d4" opacity="0.08" filter="url(#glow)" />

  <!-- Animated Cyber Scanning Beam across the background -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#primary-grad)" stroke-width="2" class="scanner" opacity="0.2" />

  <!-- Dynamic Network Topology (Right Side Graphic in Background/Midground) -->
  <g class="floating-circuit" opacity="0.85">
    <!-- Connecting Circuit Links -->
    <path d="M 850 190 L 960 110 L 1100 130" fill="none" stroke="#2563eb" stroke-width="2" class="cyber-beam" opacity="0.6" />
    <path d="M 850 190 L 970 270 L 1110 240" fill="none" stroke="#00f5d4" stroke-width="2" class="cyber-beam" opacity="0.6" />
    <path d="M 960 110 L 970 270" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5" />
    <path d="M 1100 130 L 1110 240" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />

    <!-- Central Identity Shield Node -->
    <g transform="translate(850, 190)" filter="url(#slight-glow)">
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#00d2ff" stroke-width="2.5" />
      <path d="M -12 -12 L 12 -12 L 12 0 C 12 8 0 16 0 16 C 0 16 -12 8 -12 0 Z" fill="url(#shield-grad)" opacity="0.9"/>
      <circle cx="0" cy="0" r="38" fill="none" stroke="#00f5d4" stroke-width="1.5" class="node-pulse" />
    </g>

    <!-- Node 1: Active Directory Domain Controller -->
    <g transform="translate(960, 110)">
      <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <!-- Server Icon glyph -->
      <rect x="-8" y="-9" width="16" height="5" rx="1.5" fill="#38bdf8" />
      <rect x="-8" y="-2" width="16" height="5" rx="1.5" fill="#38bdf8" />
      <rect x="-8" y="5" width="16" height="5" rx="1.5" fill="#38bdf8" />
    </g>

    <!-- Node 2: Entra ID Cloud Node -->
    <g transform="translate(970, 270)">
      <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
      <!-- Cloud Icon glyph -->
      <path d="M -7 4 A 4 4 0 0 1 -7 -3 A 6 6 0 0 1 5 -4 A 5 5 0 0 1 7 4 Z" fill="#c084fc" />
    </g>

    <!-- Node 3: Cyber Recovery Vault -->
    <g transform="translate(1100, 130)">
      <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#00f5d4" stroke-width="2" />
      <!-- Key/Vault glyph -->
      <circle cx="-2" cy="-3" r="4" fill="none" stroke="#00f5d4" stroke-width="2" />
      <path d="M 2 -1 L 7 4 L 5 6" stroke="#00f5d4" stroke-width="2" fill="none" />
    </g>

    <!-- Node 4: Attack Path / Graph Audit -->
    <g transform="translate(1110, 240)">
      <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#f43f5e" stroke-width="2" />
      <circle cx="-4" cy="-4" r="3" fill="#f43f5e" />
      <circle cx="5" cy="4" r="3" fill="#f43f5e" />
      <line x1="-3" y1="-3" x2="4" y2="3" stroke="#f43f5e" stroke-width="1.5" />
    </g>
  </g>

  <!-- Foreground Content: Unobstructed, Crisp, High Contrast -->
  <g transform="translate(80, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="16" cy="16" r="6" fill="#00f5d4" filter="url(#slight-glow)" />
      <text x="32" y="21" class="badge-text" fill="#38bdf8">HYBRID IDENTITY RESILIENCE &amp; ITDR</text>
    </g>

    <!-- Main Title (Gradient Fill + Foreground Glow) -->
    <text x="0" y="160" class="title-text" font-size="44" fill="url(#primary-grad)" filter="url(#slight-glow)">
      Awesome Active Directory
    </text>
    <text x="0" y="212" class="title-text" font-size="42">
      &amp; Entra ID Protection
    </text>

    <!-- Subtitle -->
    <text x="0" y="260" class="subtitle-text" font-size="17">
      Curated guide to cyber recovery, posture management, ITDR, and attack path analysis.
    </text>
    <text x="0" y="286" class="subtitle-text" font-size="15" fill="#64748b">
      Covering enterprise SaaS cyber vaults and production-tested open-source security tooling.
    </text>

    <!-- Capability Feature Pills -->
    <g transform="translate(0, 325)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="30" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1.2" />
      <text x="16" y="20" class="badge-text">🛡️ Forest Recovery</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="165" height="30" rx="8" fill="#0f172a" stroke="#7c3aed" stroke-width="1.2" />
      <text x="14" y="20" class="badge-text">☁️ Entra ID Backup</text>

      <!-- Pill 3 -->
      <rect x="355" y="0" width="165" height="30" rx="8" fill="#0f172a" stroke="#00f5d4" stroke-width="1.2" />
      <text x="14" y="20" class="badge-text">🔍 Attack Path Graph</text>

      <!-- Pill 4 -->
      <rect x="535" y="0" width="150" height="30" rx="8" fill="#0f172a" stroke="#e11d48" stroke-width="1.2" />
      <text x="14" y="20" class="badge-text">⚡ ITDR &amp; Auditing</text>
    </g>
  </g>
</svg>
